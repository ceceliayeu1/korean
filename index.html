<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="An offline hands-on restaurant onboarding practice lab: discovery, configuration, issue triage, tickets, QA, launch and follow-up."><title>OSM Practice Lab · Restaurant onboarding simulator</title><style>/* Self-contained bilingual OSM practice workspace. No remote assets. */
:root {
  color-scheme: light;
  --navy: #14283f;
  --navy-deep: #0e1e31;
  --canvas: #f5f5ef;
  --surface: #fff;
  --surface-subtle: #f8faf9;
  --text: #1e303a;
  --muted: #607079;
  --line: #dce4df;
  --teal: #087f75;
  --teal-dark: #08665f;
  --teal-tint: #e5f5ef;
  --amber: #996014;
  --amber-tint: #fff5dd;
  --red: #b5443e;
  --red-tint: #fff0ee;
  --blue: #376381;
  --blue-tint: #edf4f9;
  --radius: 13px;
  --shadow: 0 3px 16px rgb(20 40 63 / 4%);
  --sidebar-width: 232px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 160px; }
body { margin: 0; background: var(--canvas); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .48; }
a { color: var(--teal-dark); text-underline-offset: 3px; }
button, a, input, select, textarea, [tabindex] { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #21a795; outline-offset: 3px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 1px; }
::selection { background: #c4ece0; color: var(--navy-deep); }
[hidden] { display: none !important; }
.app-shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100dvh; min-height: 620px; display: flex; flex-direction: column; background: var(--navy); color: #d8e4ec; padding: 29px 17px 20px; overflow-y: auto; z-index: 50; }
.brand { display: flex; gap: 11px; align-items: center; padding: 0 10px 31px; color: #fff; font-size: 18px; font-weight: 750; letter-spacing: -.6px; text-decoration: none; line-height: 1.25; }
.brand small { display: block; margin-top: 5px; color: #9fb6c6; font-size: 10px; font-weight: 500; letter-spacing: 1.8px; text-transform: uppercase; }
.brand-mark { display: grid; place-items: center; width: 35px; height: 36px; border-radius: 10px; flex-shrink: 0; background: #b4ebce; color: #173a37; font-size: 21px; font-weight: 800; }
.sidebar .eyebrow { color: #8fa8b8; padding: 0 13px; margin: 14px 0 10px; }
.sidebar nav { display: grid; gap: 6px; }
.nav-item { position: relative; width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 13px; background: transparent; border: 1px solid transparent; border-radius: 9px; text-align: left; color: #bfcfda; text-decoration: none; transition: background .16s, color .16s; }
.nav-item:hover { background: rgb(255 255 255 / 6%); color: #fff; }
.nav-item.active { color: #c5f7df; background: #224739; border-color: #3c6350; }
.nav-item.active::before { content: ''; width: 3px; height: 19px; position: absolute; left: -18px; background: #b8ebce; border-radius: 0 3px 3px 0; }
.nav-icon { display: grid; place-items: center; flex: 0 0 19px; width: 19px; height: 21px; font-size: 17px; opacity: .95; }
.nav-icon svg { width: 18px; height: 18px; }
.nav-label { flex: 1; font-weight: 500; font-size: 12px; line-height: 1.45; }
.nav-label small { display: block; opacity: .7; font-size: 10px; }
.nav-count { display: grid; place-items: center; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 5px; color: #d8e8e1; background: rgb(255 255 255 / 9%); font-size: 10px; font-weight: 700; }
.sidebar-footer { margin-top: auto; padding: 21px 11px 0; color: #a8becb; font-size: 11px; line-height: 1.7; border-top: 1px solid rgb(255 255 255 / 10%); }
.sidebar-footer strong { display: block; margin-bottom: 4px; color: #e0ece9; font-weight: 600; }
.main-shell { min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 73px; padding: 17px 34px; background: var(--surface); border-bottom: 1px solid var(--line); }
.eyebrow { color: var(--muted); font-size: 10px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
.topbar .eyebrow { margin-bottom: 2px; }
.top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 9px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 37px; padding: 8px 13px; border: 1px solid transparent; border-radius: 7px; font-size: 12px; line-height: 1.45; font-weight: 650; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, box-shadow .15s; }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); box-shadow: 0 2px 3px rgb(8 127 117 / 10%); }
.btn-primary:hover:not(:disabled) { background: var(--teal-dark); border-color: var(--teal-dark); }
.btn-secondary { background: #fff; border-color: #cfdad4; color: #344c48; }
.btn-secondary:hover:not(:disabled) { background: #f0f6f2; border-color: #a7bfb3; }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { background: #eaf0eb; color: var(--text); }
.btn-small { min-height: 29px; padding: 5px 9px; font-size: 11px; }
.btn-danger { color: var(--red); background: #fff; border-color: #e5c4bf; }
.btn-danger:hover:not(:disabled) { background: var(--red-tint); }
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid #cce2d4; border-radius: 100px; background: #f0f8f1; color: #416647; font-size: 10px; font-weight: 600; white-space: nowrap; }
.status-pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #559663; }
.workspace-header { max-width: 1700px; margin: 0 auto; padding: 31px 34px 22px; }
h1 { margin: 5px 0 8px; color: var(--navy); font-size: clamp(24px, 2.5vw, 34px); line-height: 1.18; font-weight: 720; letter-spacing: -1px; }
h2, h3, h4 { margin-top: 0; color: var(--navy); line-height: 1.4; }
h2 { font-size: 18px; letter-spacing: -.35px; }
h3 { font-size: 14px; }
p { margin: 0 0 12px; }
p:last-child { margin-bottom: 0; }
.subtitle { color: var(--muted); font-size: 13px; max-width: 760px; }
.case-toolbar { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 23px; }
.case-select { min-width: 280px; max-width: 100%; padding: 9px 34px 9px 12px; border: 1px solid #cbd7cf; border-radius: 7px; background: #fff; color: var(--text); font-size: 12px; font-weight: 600; }
.stage-strip { position: sticky; top: 0; z-index: 25; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0; padding: 0 34px; background: var(--canvas); border-bottom: 1px solid #dbe3da; box-shadow: 0 4px 7px rgb(20 40 63 / 2%); }
.stage-step { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 13px 6px 14px; min-height: 69px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #6b7b77; text-align: center; font-size: 10px; line-height: 1.4; font-weight: 600; }
.stage-step:hover { color: var(--teal); background: #eaf0e9; }
.stage-step.active { color: var(--teal-dark); border-bottom-color: var(--teal); background: linear-gradient(0deg, #e5f0e7, transparent); }
.stage-step.complete { color: #4c795b; }
.stage-step .step-num, .stage-step .step-number { display: grid; place-items: center; width: 20px; height: 20px; border: 1px solid #cdd8cf; border-radius: 50%; background: #fff; font-size: 10px; }
.stage-step.active .step-num, .stage-step.active .step-number { background: var(--teal); border-color: var(--teal); color: #fff; }
.stage-step.complete .step-num, .stage-step.complete .step-number { background: #e3f0e5; color: #467350; }
.content-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: start; gap: 23px; max-width: 1700px; margin: 0 auto; padding: 26px 34px 48px; }
.main-panel, .context-panel { min-width: 0; display: grid; gap: 19px; }
.context-panel { position: sticky; top: 100px; }
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 21px; border-bottom: 1px solid #e7ece7; }
.card-header h2, .card-header h3 { margin: 0; }
.card-body { padding: 21px; }
.context-panel .card-header { padding: 15px 17px; }
.context-panel .card-body { padding: 17px; font-size: 12px; }
.section-title { margin: 0 0 12px; color: var(--navy); font-size: 14px; font-weight: 700; letter-spacing: -.15px; }
.muted { color: var(--muted); }
.small, small { font-size: 11px; }
.kicker { color: var(--teal-dark); font-size: 10px; font-weight: 750; letter-spacing: 1.2px; text-transform: uppercase; }
.tag { display: inline-flex; align-items: center; width: fit-content; padding: 3px 7px; border: 1px solid transparent; border-radius: 5px; font-size: 10px; line-height: 1.4; font-weight: 650; white-space: nowrap; }
.tag-warning { background: var(--amber-tint); color: var(--amber); border-color: #f1dfb6; }
.tag-success { background: var(--teal-tint); color: #24634a; border-color: #cee5d8; }
.tag-danger { background: var(--red-tint); color: var(--red); border-color: #f0d5d0; }
.tag-neutral { background: #eff2f1; color: #64736d; border-color: #dfe5e1; }
.banner { padding: 12px 14px; border: 1px solid; border-radius: 8px; font-size: 12px; line-height: 1.65; }
.banner-info { background: var(--blue-tint); border-color: #d7e4ed; color: #375b74; }
.banner-warning { background: var(--amber-tint); border-color: #ecdcb5; color: #80551f; }
.banner-success { background: var(--teal-tint); border-color: #c7e0d2; color: #28654a; }
.banner-error { background: var(--red-tint); border-color: #edccc6; color: #963e38; }
.banner strong { display: inline; }
.metrics-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.metric { padding: 15px 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.metric-value { color: var(--navy); font-size: 25px; font-weight: 750; letter-spacing: -.8px; line-height: 1.3; }
.metric-label { color: var(--muted); margin-top: 4px; font-size: 10px; font-weight: 550; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
.field:last-child { margin-bottom: 0; }
.field-label, .field > label { display: block; color: #31483e; font-size: 12px; line-height: 1.45; font-weight: 650; }
.field-help { color: #697b70; font-size: 11px; line-height: 1.55; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 17px; }
.span-2 { grid-column: 1 / -1; }
input, select, textarea { max-width: 100%; color: var(--text); border: 1px solid #ccd8d0; border-radius: 6px; background: #fff; transition: border-color .15s, box-shadow .15s; }
input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; padding: 9px 10px; font-size: 12px; line-height: 1.5; }
input:hover, select:hover, textarea:hover { border-color: #a1b9ab; }
input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgb(8 127 117 / 8%); }
textarea { min-height: 110px; resize: vertical; }
input::placeholder, textarea::placeholder { color: #8a9991; opacity: 1; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--teal); cursor: pointer; }
input[readonly], textarea[readonly] { background: #f5f7f4; color: #61716a; }
input[aria-invalid=true], select[aria-invalid=true], textarea[aria-invalid=true] { border-color: var(--red); }
.table-scroll { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; scrollbar-width: thin; }
.data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 11px; }
.data-table th { padding: 10px 10px; background: #f1f5f0; color: #53675a; border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 650; white-space: nowrap; }
.data-table td { padding: 10px; border-bottom: 1px solid #e9eee8; vertical-align: top; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #fbfcf9; }
.data-table input:not([type=checkbox]):not([type=radio]), .data-table select { min-width: 76px; padding: 6px 7px; font-size: 11px; }
.data-table textarea { min-width: 120px; min-height: 58px; padding: 6px 7px; font-size: 11px; }
.question-list, .check-list, .feedback-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.question-item { padding: 13px 14px; border: 1px solid #dde5dd; border-radius: 8px; background: #fcfdfa; }
.question-item > label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.question-item strong { color: #2d463a; font-size: 12px; }
.answer { margin-top: 10px; padding: 12px; border-left: 3px solid #80b89b; border-radius: 0 5px 5px 0; background: #edf5ed; color: #415b49; font-size: 12px; }
.check-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; color: #3e5348; font-size: 12px; }
.check-item label { cursor: pointer; }
.test-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid #dfe6de; border-radius: 7px; margin-bottom: 9px; font-size: 12px; }
.test-pass { border-left: 3px solid #75a77b; background: #f5faf3; }
.test-fail { border-left: 3px solid #c97665; background: #fff8f4; }
.issue-card, .ticket-card { padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-bottom: 11px; }
.issue-card:last-child, .ticket-card:last-child { margin-bottom: 0; }
.issue-card h3, .ticket-card h3 { margin: 7px 0; font-size: 13px; }
.issue-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; color: var(--muted); font-size: 10px; }
.ticket-id { color: var(--teal-dark); font: 650 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .3px; }
.empty-state { padding: 30px 19px; text-align: center; color: #75877b; font-size: 12px; border: 1px dashed #cedacf; border-radius: 9px; background: #fafcf8; }
.empty-state strong { display: block; margin-bottom: 6px; color: #4c6554; }
.timeline { position: relative; display: grid; gap: 19px; margin: 0; padding: 2px 0 0 20px; list-style: none; }
.timeline::before { content: ''; position: absolute; top: 9px; bottom: 10px; left: 5px; width: 1px; background: #d2dfd2; }
.timeline-item { position: relative; font-size: 11px; }
.timeline-item::before { content: ''; position: absolute; left: -19px; top: 5px; width: 9px; height: 9px; border: 2px solid #fff; border-radius: 50%; background: #77a58a; box-shadow: 0 0 0 1px #cbdacc; }
.timeline-item strong { display: block; color: #405748; }
.feedback-item { padding: 12px 13px; background: #f5f8f2; border-left: 3px solid #91b593; border-radius: 0 6px 6px 0; font-size: 12px; }
.feedback-item.error, .feedback-item.fail { background: var(--red-tint); border-left-color: #c47a6b; }
.feedback-item.warning { background: var(--amber-tint); border-left-color: #c9a267; }
.score-ring { display: grid; align-content: center; justify-items: center; width: 117px; height: 117px; margin: 6px auto 18px; border: 8px solid #dcebe0; border-top-color: var(--teal); border-right-color: var(--teal); border-radius: 50%; color: var(--teal-dark); font-size: 30px; font-weight: 750; line-height: 1.25; }
.score-ring small { font-size: 10px; font-weight: 500; color: var(--muted); }
.score-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.score-card { padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: #fafcf8; font-size: 11px; }
.score-card strong { color: var(--navy); }
.progress-track { height: 5px; background: #e5ede3; border-radius: 20px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; max-width: 100%; background: var(--teal); border-radius: inherit; transition: width .3s ease; }
.toast { position: fixed; bottom: 25px; left: calc(50% + 80px); transform: translateX(-50%); z-index: 120; max-width: min(520px, calc(100vw - 32px)); padding: 12px 20px; border: 1px solid #c1ddcb; border-radius: 10px; background: #183f34; color: #e8fff0; box-shadow: 0 7px 28px rgb(14 30 49 / 18%); font-size: 12px; }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgb(14 30 49 / 55%); backdrop-filter: blur(3px); }
.modal { width: min(650px, 100%); max-height: calc(100dvh - 48px); overflow-y: auto; padding: 25px; background: #fff; border: 1px solid #d4dfd5; border-radius: 16px; box-shadow: 0 18px 65px rgb(14 30 49 / 22%); }
.modal h2 { margin-bottom: 10px; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; margin-top: 23px; }
.log-entry { padding: 10px 0; border-bottom: 1px solid #e5ece3; color: #526a57; font-size: 11px; overflow-wrap: anywhere; }
.log-entry:last-child { border-bottom: 0; }
.log-entry time { color: #819080; font-size: 10px; }
.tabbar { display: flex; gap: 5px; overflow-x: auto; padding: 5px; border: 1px solid #dce6db; border-radius: 8px; background: #edf3e9; }
.tab-btn { padding: 8px 13px; border: 1px solid transparent; border-radius: 5px; color: #657762; background: transparent; font-size: 11px; font-weight: 600; white-space: nowrap; }
.tab-btn.active { background: #fff; color: var(--teal-dark); border-color: #d9e4d7; box-shadow: 0 1px 4px rgb(20 40 63 / 4%); }
.tab-btn:hover:not(.active) { background: #e3ecde; }
.split { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: .92em; overflow-wrap: anywhere; }
.answer-key { margin-top: 15px; padding: 16px; border: 1px solid #c9dfcc; border-radius: 8px; background: #f0f7ed; color: #3e5d41; font-size: 12px; }
.answer-key summary { cursor: pointer; font-weight: 700; color: #315d42; }
.answer-key[open] summary { margin-bottom: 12px; }
.completion-badge { display: inline-flex; gap: 5px; align-items: center; padding: 5px 9px; border-radius: 100px; background: #dceee1; color: #356a44; font-size: 10px; font-weight: 650; }
.mobile-nav-toggle { display: none; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid #d5dfd5; border-radius: 7px; background: #fff; color: var(--navy); font-size: 19px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 19px 0; }
ul, ol { padding-left: 20px; }
li { margin-bottom: 5px; }
svg { vertical-align: middle; }
@media (min-width: 1600px) { .content-grid { grid-template-columns: minmax(0, 1fr) 350px; gap: 28px; } .card-body { padding: 24px; } }
@media (max-width: 1200px) { :root { --sidebar-width: 210px; } .topbar { padding: 17px 24px; } .workspace-header { padding: 26px 24px 20px; } .stage-strip { padding: 0 24px; } .content-grid { grid-template-columns: minmax(0, 1fr) 285px; padding: 22px 24px 40px; gap: 18px; } .stage-step { font-size: 9px; padding-inline: 3px; } .card-body { padding: 17px; } .card-header { padding: 15px 17px; } }

</script><script>/* OSM Practice Lab — offline, deterministic training; no external services. */
'use strict';
(() => {

    ['Configuration', '配置工作表', 'Turn approved business rules into a clear implementation handoff.'],
    ['Issue triage', '问题分类', 'Separate tasks, defects, changes and live incidents.'],
    ['Ticket desk', '工单练习', 'Create actionable work with evidence and accountable owners.'],
    ['QA laboratory', '质量检查', 'Check both accurate output and an agent’s interpretation.'],
    ['Launch decision', '上线判断', 'Make an evidence-backed go, hold or recovery decision.'],
    ['Days 1–14', '上线后跟进', 'Review hotline reports, update the customer and verify recovery.'],

  const SEVERITIES = { low: 'Low · limited operational impact', medium: 'Medium · scoped friction / workaround', high: 'High · core prelaunch blocker or serious scoped harm', critical: 'Critical · active major core-service failure' };
  const PRIORITIES = { normal: 'Normal · scheduled work', urgent: 'Urgent · deadline / material impact', immediate: 'Immediate · contain active harm' };
  const CUSTOMER_ZONE = 'America/New_York (ET)';
  const OWNERS = ['Customer', 'Implementation', 'Voice Ops', 'Engineering', 'Support'];
  const STATUSES = ['New', 'In progress', 'Blocked', 'Awaiting validation', 'Resolved', 'Closed'];

  const tr = (en, zh) => state.language === 'zh' ? zh : en;
  const freshDraft = s => ({issueId:s.issues[0]?.id || '',title:'',type:'',severity:'',priority:'',owner:'',environment:s.phase==='live'?'Live':'Prelaunch test',expected:'',actual:'',repro:'',evidence:'',workaround:'',nextAction:'',updateTime:'',acceptance:'',closure:''});

  let route = 'workspace';
  let notice = null;
  let currentTicket = null;
  let savingTimer;
  let toastTimer;
  const root = document.getElementById('app');
  if (!SCENARIOS.length) { root.textContent = 'Case data did not load. Rebuild the standalone practice page.'; return; }
  function sanitise(raw) {

    clean.language = raw.language==='zh'?'zh':'en';

      const v=raw.cases[s.id]; if (!isPlain(v)) continue;

      c.discovered=Array.isArray(v.discovered)?v.discovered.filter(id=>s.discovery.some(d=>d.id===id)):[];
      c.day=Number.isFinite(v.day)?Math.max(0,Math.min(14,v.day)):c.day;
      c.ruleRevision=Number.isInteger(v.ruleRevision)?Math.max(0,v.ruleRevision):0;
      for(const r of s.rules) if(isPlain(v.rules) && typeof v.rules[r.id]==='string') c.rules[r.id]=safeString(v.rules[r.id],2000);
      for(const i of s.issues) {
        const x=isPlain(v.classifications)?v.classifications[i.id]:null;
        if(isPlain(x)) c.classifications[i.id]={type:TYPES[x.type]?x.type:'',severity:SEVERITIES[x.severity]?x.severity:'',priority:PRIORITIES[x.priority]?x.priority:'',owner:OWNERS.includes(x.owner)?x.owner:''};
      }
      for(const q of s.qa) {
        if(isPlain(v.agentAnswers)) c.agentAnswers[q.id]=safeString(v.agentAnswers[q.id],2000);
        const qv=isPlain(v.qaResults)?v.qaResults[q.id]:null;

        if(isPlain(qv) && qv.revision===c.ruleRevision) c.qaResults[q.id]={pass:qaPass(s,c,q),at:safeString(qv.at,100)||now(),revision:c.ruleRevision};
      }
      if(isPlain(v.ticketDraft)) for(const k of TICKET_FIELDS) c.ticketDraft[k]=safeString(v.ticketDraft[k]);
      if(isPlain(v.ticketDraft) && typeof v.ticketDraft.editingId==='string') c.ticketDraft.editingId=safeString(v.ticketDraft.editingId,100);
      const importTicket = t => {
        const out={};for(const k of TICKET_FIELDS) out[k]=safeString(t[k]);
        out.acknowledgedAt=safeString(t.acknowledgedAt,100);out.id=safeString(t.id,100);out.createdAt=safeString(t.createdAt,100)||now();out.status=STATUSES.includes(t.status)?t.status:'New';
        if(!s.issues.some(i=>i.id===out.issueId)) return null;
        return out;
      };
      c.tickets=Array.isArray(v.tickets)?v.tickets.slice(0,100).filter(isPlain).map(importTicket).filter(Boolean):[];
      c.reviewedEvents=Array.isArray(v.reviewedEvents)?v.reviewedEvents.filter(x=>Number.isInteger(x)&&x>=0&&x<s.monitoring.length):[];
      c.updates=Array.isArray(v.updates)?v.updates.slice(0,100).filter(isPlain).map(u=>({text:safeString(u.text),at:safeString(u.at,100)||now(),day:Number(u.day)||0})):[];
      c.coachViewed=Array.isArray(v.coachViewed)?v.coachViewed.filter(x=>['discovery','configuration','ticket','launch','followup'].includes(x)):[];
      c.coachOpen=Array.isArray(v.coachOpen)?v.coachOpen.filter(x=>c.coachViewed.includes(x)):[];
      c.log=Array.isArray(v.log)?v.log.slice(0,1000).filter(isPlain).map(l=>({at:safeString(l.at,100)||now(),action:safeString(l.action,200),detail:safeString(l.detail,2000)})):[];

      if(c.launchStatus!=='held' && !readiness(s,c).ready) c.launchStatus='';
      clean.cases[s.id]=c;
    }
    return clean;
  }
  try { const saved=localStorage.getItem(STORAGE_KEY); if(saved) state=sanitise(JSON.parse(saved)); }
  catch(e) { storageAvailable=false; }
  function scenario() { return SCENARIOS.find(s=>s.id===state.selectedCase)||SCENARIOS[0]; }
  function work() { const s=scenario(); return state.cases[s.id]||(state.cases[s.id]=freshCase(s)); }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); storageAvailable=true; }
    catch(e) { storageAvailable=false; }
    const el=document.getElementById('save-status');if(el) el.textContent=storageAvailable?tr('Saved on this browser','已保存在此浏览器'):tr('Browser storage unavailable · export your work','浏览器无法保存，请导出进度');
  }
  function log(action,detail='') { work().log.push({at:now(),action,detail}); if(work().log.length>1000)work().log.shift(); persist(); }
  function flash(text,type='info') { notice={text,type}; render(); }
  function toast(text) { let el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3600); }
  function rulePass(s,c,r) { return [r.expected,...(r.accepted||[])].some(x=>norm(c.rules[r.id])===norm(x)); }
  function qaPass(s,c,q) {

    if(q.kind==='usability') return [q.expected,r.expected,...(r.accepted||[]),...(q.accepted||[])].filter(Boolean).some(v=>norm(v)===norm(c.agentAnswers[q.id]));

  }
  function environmentFits(s,t) { return s.phase==='live'?t.environment==='Live':s.phase==='reactivation'?['Reactivation test','Prelaunch test'].includes(t.environment):s.phase==='change'?['Change validation','Prelaunch test'].includes(t.environment):t.environment==='Prelaunch test'; }
  function classificationCorrect(i,x={}) { return x.type===i.expectedType && x.severity===i.expectedSeverity && x.priority===i.expectedPriority && x.owner===i.expectedOwner; }
  function ticketScore(t,s=scenario()) {
    const issue=s.issues.find(i=>i.id===t.issueId);const kw=s.ticketKeywords||{};
    const any=(value,words)=>!(words?.length)||words.some(w=>norm(value).includes(norm(w)));
    const lines=v=>String(v||'').split(/\n/).filter(x=>x.trim()).length;
    const result=[
      {label:'Searchable impact-led title',zh:'标题明确描述影响',points:10,pass:wordish(t.title)>=15,tip:'Name the affected flow and scope, not “urgent issue”.'},
      {label:'Specific expected result',zh:'预期结果具体',points:10,pass:wordish(t.expected)>=25&&any(t.expected,kw.expected),tip:'Use the approved rule and an observable result.'},
      {label:'Observed result and scope',zh:'实际结果及范围',points:10,pass:wordish(t.actual)>=25&&any(t.actual,kw.actual),tip:'State what failed, which examples, and what is not yet known.'},
      {label:'Reproducible investigation steps',zh:'可复现步骤',points:10,pass:lines(t.repro)>=3&&wordish(t.repro)>=60,tip:'Write at least three separate steps: input, action, observed output.'},
      {label:'Traceable evidence',zh:'证据可追溯',points:10,pass:wordish(t.evidence)>=25&&/\d/.test(t.evidence),tip:'Include fictional test/order references, timestamps or configuration versions. Never real credentials.'},
      {label:'Classification matches this issue',zh:'分类与影响一致',points:20,pass:!!issue&&classificationCorrect(issue,t)&&environmentFits(s,t),tip:issue?issue.rationale:'Link the ticket to a scenario issue.'},
      {label:'Owner and concrete next action',zh:'负责人及下一步',points:10,pass:OWNERS.includes(t.owner)&&wordish(t.nextAction)>=25,tip:'Specify what the assigned owner should investigate or decide.'},
      {label:'Committed next update',zh:'明确下次更新时间',points:10,pass:/^\d{2}:\d{2}$/.test(t.updateTime),tip:'Set a clock time in the simulated customer’s local zone; a checkpoint is not a fix ETA.'},
      {label:'Accuracy and usability acceptance',zh:'准确性及操作验收',points:10,pass:lines(t.acceptance)>=2&&wordish(t.acceptance)>=50&&/agent|voice|usab|接单|接听|操作|话务/i.test(t.acceptance),tip:'Use separate checks for order/configuration correctness and an agent’s ability to apply the rule.'}

  function readiness(s=scenario(),c=work()) {

  function score(s=scenario(),c=work()) {

  function options(values,selected,placeholder='Select…') {

  }

      <aside class="sidebar" aria-label="Practice navigation"><a href="#" data-route="workspace" class="brand"><span class="brand-mark">O</span><span>OSM<span class="brand-sub">PRACTICE LAB</span></span></a>
      <div class="sidebar-label">${tr('YOUR WORKSPACE','练习工作台')}</div>
      <button class="nav-item ${route==='library'?'active':''}" data-route="library"><span class="nav-icon">▦</span><span>Case library / 案例库</span><span class="nav-count">${SCENARIOS.length}</span></button>
      <div class="sidebar-label">${tr('END-TO-END WORKFLOW','全流程实践')}</div>
      ${STAGES.map((st,i)=>`<button class="nav-item ${route==='workspace'&&stage===i?'active':''}" data-stage="${i}" aria-current="${route==='workspace'&&stage===i?'step':'false'}"><span class="nav-icon ${done[i]?'completion-badge':''}">${done[i]?'✓':String(i+1).padStart(2,'0')}</span><span class="nav-label">${tr(st[0],st[1])}</span></button>`).join('')}

  function renderLibrary() {

    }).join('')}</div>`;
  }
  function renderContext() {

      <div class="card"><div class="card-body"><div class="kicker">YOUR WORK / 你的进度</div><div class="metric-value">${score()}<span class="muted small"> / 100</span></div><p class="small muted">${tr('Evidence-based workflow checkpoints—not a language or judgement score.','仅计算流程检查项，不评价语言质量或全部判断。')}</p><div class="progress-track"><div class="progress-fill" style="width:${score()}%"></div></div><div class="context-stats"><span>${c.tickets.length} ${tr('tickets','工单')}</span><span>${Object.values(c.qaResults).filter(q=>q.pass).length}/${s.qa.length} QA</span><span>${missing} ${tr('essential questions left','个关键问题未问')}</span></div>${c.coachViewed.length?`<div class="tag tag-warning">${tr('Guided attempt','已使用提示')}</div>`:`<div class="tag tag-neutral">${tr('Independent attempt so far','目前为独立练习')}</div>`}</div></div>`;

  function nextButton(label='Continue') { return `<div class="step-footer"><button class="btn btn-primary" data-action="next">${tr(label,'继续下一步')} →</button></div>`; }
  function renderStage(n) {
    return [renderDiscovery,renderConfig,renderTriage,renderTickets,renderQA,renderLaunch,renderHypercare,renderReview][n]();
  }
  function renderDiscovery() {
    const s=scenario(),c=work();
    return `<div class="card"><div class="card-body"><div class="kicker">INCOMING CUSTOMER MESSAGE / 客户消息</div><blockquote class="customer-message">${esc(s.initialMessage)}</blockquote><p class="muted small">${tr('Ask the questions below to reveal the owner’s answers. Capture the actual rules and unresolved dependencies in your notes.','选择下方问题查看老板回答，再记录实际规则和待确认事项。')}</p><div class="question-list">${s.discovery.map(q=>`<div class="question-item"><button class="question-button" data-action="ask" data-id="${esc(q.id)}"><span>${esc(q.question)}</span><span>${c.discovered.includes(q.id)?'✓':'+'}</span></button>${c.discovered.includes(q.id)?`<div class="answer"><span class="kicker">RESTAURANT OWNER / 老板回答</span><p>${esc(q.answer)}</p></div>`:''}</div>`).join('')}</div></div></div>
      <div class="card"><div class="card-body">${field(tr('Your discovery notes','你的需求记录'),area('notes',c.notes,tr('Record the approved rules, who must confirm them, and what is still unknown.','记录规则、确认人，以及仍未确定的内容。')),'A useful handoff separates approved facts, assumptions and open questions.')}${coach('discovery')}</div></div>${nextButton('Open configuration worksheet')}`;
  }
  function renderConfig() {
    const s=scenario(),c=work();
    return `<div class="banner banner-info">${tr('Edit the cells. The starting configuration contains deliberate errors or gaps. Use your discovery answers as the source of truth.','直接编辑单元格。初始配置包含错误或缺项，请用访谈结果核对。')}</div><div class="card"><div class="card-header"><h2>${tr('Configuration worksheet','配置工作表')}</h2><span class="tag tag-neutral">Revision ${c.ruleRevision+1}</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>${tr('Operational rule','运营规则')}</th><th>${tr('Your configuration value','你的配置值')}</th><th>${tr('Implementation note','实施说明')}</th></tr></thead><tbody>${s.rules.map(r=>`<tr><th scope="row">${esc(r.label)}</th><td><input aria-label="${esc(r.label)}" data-rule="${esc(r.id)}" value="${esc(c.rules[r.id])}" placeholder="${esc(tr('Enter the approved value','输入已确认规则'))}"></td><td class="small muted">${esc(r.help)}</td></tr>`).join('')}</tbody></table></div><div class="card-body"><label class="check-item"><input type="checkbox" data-field="approved" ${c.approved?'checked':''}>${s.targetLaunchDecision==='hold'?tr('I have reviewed the draft sources and preserved pending approvals / future timing. This is not activation approval.','我已核对草稿来源，并如实保留待批准或未来生效状态；这不代表已批准启用。'):tr('I have read back these rules and recorded customer approval in this simulation.','在此模拟场景中，我已复述规则并记录客户确认。')}</label><p class="small muted">${tr('Editing a rule invalidates earlier QA and release approval. These are conceptual rules, not claimed Greendot fields.','修改规则会使先前 QA 和上线批准失效。这是概念规则表，并非 Greendot 的真实字段。')}</p><button class="btn btn-secondary" data-action="check-config">${tr('Check worksheet','检查工作表')}</button><button class="btn btn-ghost" data-action="export-rules">${tr('Export worksheet CSV','导出工作表 CSV')}</button>${c.configFeedback?`<div class="feedback-list">${s.rules.map(r=>`<div class="feedback-item ${rulePass(s,c,r)?'test-pass':'test-fail'}">${rulePass(s,c,r)?'✓':'!'} ${esc(r.label)} — ${rulePass(s,c,r)?tr('matches the approved rule','符合已确认规则'):tr('does not match yet; check the owner’s answer and the suggested format','尚未符合，请核对老板回答及填写格式')}</div>`).join('')}</div>`:''}${coach('configuration')}</div></div>${nextButton('Triage the issues')}`;
  }
  function renderTriage() {
    const s=scenario(),c=work();
    return `<div class="card"><div class="card-body"><h2>${tr('Practice classification policy','练习分类规则')}</h2><p class="small">${tr('Task: obtain information or perform operational work. Defect: reproducible behaviour contradicts an approved requirement. Change: a requested modification to an approved baseline. Incident: active live impact requiring coordinated containment.','Task：收集信息或完成运营工作。Defect：可复现结果不符合已确认需求。Change：修改已批准版本。Incident：真实线上业务受影响，需要协调控制。')}</p><p class="small muted">${tr('High can be a prelaunch blocker. Critical is reserved here for active major service failure; urgency does not create live impact. The exercise’s owner is the first accountable investigation queue, not the only collaborating team.','High 可用于上线前阻塞。Critical 在本练习中指正在发生的严重线上影响。负责人指首个负责排查的队列，并不排除其他协作方。')}</p></div></div>${s.issues.map(i=>{
      const x=c.classifications[i.id]||{},correct=classificationCorrect(i,x);
      return `<article class="card issue-card"><div class="card-body"><div class="kicker">${esc(i.id)}</div><h2>${esc(i.title)}</h2><p>${esc(i.evidence)}</p><div class="form-grid">${field(tr('Work type','工作类型'),`<select aria-label="${esc(i.id)} work type" data-triage="${esc(i.id)}" data-key="type">${options(TYPES,x.type)}</select>`)}${field(tr('Severity','严重程度'),`<select aria-label="${esc(i.id)} severity" data-triage="${esc(i.id)}" data-key="severity">${options(SEVERITIES,x.severity)}</select>`)}${field(tr('Priority','优先级'),`<select aria-label="${esc(i.id)} priority" data-triage="${esc(i.id)}" data-key="priority">${options(PRIORITIES,x.priority)}</select>`)}${field(tr('Accountable queue','负责队列'),`<select aria-label="${esc(i.id)} owner" data-triage="${esc(i.id)}" data-key="owner">${options(OWNERS,x.owner)}</select>`)}</div>${c.triageGraded?`<div class="banner ${correct?'banner-success':'banner-warning'}">${correct?'✓ '+tr('Classification fits the evidence.','分类符合证据。'):tr('Revisit your classification.','请重新检查分类。')} ${esc(i.rationale)}${!correct?`<p class="small">${tr('Practice answer','参考分类')}: ${esc(i.expectedType)} / ${esc(i.expectedSeverity)} / ${esc(i.expectedPriority)} / ${esc(i.expectedOwner)}</p>`:''}</div>`:''}</div></article>`;
    }).join('')}<div class="step-footer"><button class="btn btn-secondary" data-action="grade-triage">${tr('Check my classification','检查我的分类')}</button><button class="btn btn-primary" data-action="next">${tr('Open ticket desk','进入工单台')} →</button></div>`;

  function ticketForm() {
    const s=scenario(),c=work(),d=c.ticketDraft;

      ${field(tr('Related issue','关联问题'),`<select data-ticket="issueId" aria-label="Related issue">${options(Object.fromEntries(s.issues.map(i=>[i.id,i.id+' · '+i.title])),d.issueId)}</select>`,'Create one ticket per distinct cause/work item. Repeated contacts can link to an existing ticket. Ticket milestone: 70+ checklist score plus owner acknowledgement for each issue.',true)}
      ${field(tr('Ticket title','工单标题'),`<input data-ticket="title" aria-label="Ticket title" value="${esc(d.title)}" placeholder="Prelaunch blocker · affected flow · location / scope">`,'Impact + affected function + scope.',true)}
      ${field(tr('Work type','工作类型'),`<select data-ticket="type" aria-label="Ticket work type">${options(TYPES,d.type)}</select>`)}
      ${field(tr('Environment','环境'),`<select data-ticket="environment" aria-label="Ticket environment">${options(['Prelaunch test','Live','Reactivation test','Change validation'],d.environment)}</select>`)}
      ${field(tr('Severity','严重程度'),`<select data-ticket="severity" aria-label="Ticket severity">${options(SEVERITIES,d.severity)}</select>`)}
      ${field(tr('Priority','优先级'),`<select data-ticket="priority" aria-label="Ticket priority">${options(PRIORITIES,d.priority)}</select>`)}
      ${field(tr('Accountable owner / queue','负责人／队列'),`<select data-ticket="owner" aria-label="Ticket owner">${options(OWNERS,d.owner)}</select>`)}
      ${field(tr('Next customer update (local time)','下次客户更新时间（当地）'),`<input type="time" data-ticket="updateTime" aria-label="Next customer update" value="${esc(d.updateTime)}">`,'Practice zone: America/New_York (ET). Record a checkpoint, not an unsupported fix ETA.')}
      ${field(tr('Expected result','预期结果'),`<textarea data-ticket="expected" aria-label="Expected result" placeholder="Approved business rule and observable expected output">${esc(d.expected)}</textarea>`,'Use the rule the restaurant approved.')}
      ${field(tr('Actual result and scope','实际结果及范围'),`<textarea data-ticket="actual" aria-label="Actual result" placeholder="What happened, which examples, how many, test or live impact">${esc(d.actual)}</textarea>`,'Do not present a root-cause hypothesis as a fact.')}
      ${field(tr('Steps to reproduce / investigate','复现／排查步骤'),`<textarea data-ticket="repro" aria-label="Reproduction steps" placeholder="1. Select the approved test route…\n2. Choose…\n3. Compare…">${esc(d.repro)}</textarea>`,'At least three steps on separate lines; never repeat uncertain live transactions blindly.')}
      ${field(tr('Evidence references','证据引用'),`<textarea data-ticket="evidence" aria-label="Evidence references" placeholder="Fictional order/test IDs; timestamps and timezone; configuration version; expected/received views">${esc(d.evidence)}</textarea>`,'Use invented case references only. Do not enter real customer secrets or payment data.')}
      ${field(tr('Containment / workaround','控制影响／替代方案'),`<textarea data-ticket="workaround" aria-label="Containment or workaround" placeholder="What is safe now, who approves it, and what remains blocked?">${esc(d.workaround)}</textarea>`)}
      ${field(tr('Requested next action','要求的下一步'),`<textarea data-ticket="nextAction" aria-label="Requested next action" placeholder="Who should check what, and what decision/evidence do you need?">${esc(d.nextAction)}</textarea>`)}
      ${field(tr('Acceptance and closure checks','验收及关闭标准'),`<textarea data-ticket="acceptance" aria-label="Acceptance checks" placeholder="1. Accuracy: expected order/price/route verified…\n2. Agent usability: an agent applies the rule without guessing…">${esc(d.acceptance)}</textarea>`,'Cover both correct results and the agent’s actual task.',true)}
      </div><div class="step-footer"><button type="button" class="btn btn-secondary" data-action="save-draft">${tr('Save draft','保存草稿')}</button><button type="submit" class="btn btn-primary">${tr('Create practice ticket','创建练习工单')}</button></div></form>`;

      <div class="card"><div class="card-header"><h2>${tr('Ticket queue','工单队列')}</h2><button class="btn btn-ghost btn-small" data-action="export-tickets">${tr('Export CSV','导出 CSV')}</button></div><div class="card-body">${c.tickets.length?c.tickets.map(t=>`<button class="ticket-card" data-action="open-ticket" data-id="${esc(t.id)}"><span class="ticket-id">${esc(t.id)}</span><span><strong>${esc(t.title)}</strong><span class="small muted">${esc(t.type)} · ${esc(t.owner)} · ${esc(t.status)}</span></span><span class="tag ${ticketScore(t).total>=70?'tag-success':'tag-warning'}">${ticketScore(t).total}/100</span></button>`).join(''):`<div class="empty-state">${tr('No tickets created. Turn the issue evidence into an actionable handoff below.','尚无工单。请把问题证据整理为下面的可执行交接。')}</div>`}</div></div>
      ${t?renderTicketDetail(t):''}<div class="card"><div class="card-header"><h2>${tr('New ticket','新建工单')}</h2><button class="btn btn-ghost btn-small" data-action="from-triage">${tr('Use my triage choices','使用我的分类结果')}</button></div><div class="card-body">${ticketForm()}${coach('ticket')}</div></div>${nextButton('Run acceptance tests')}`;

  function renderTicketDetail(t) {

n('')}</div><button class="btn btn-primary" data-action="advance-day" ${!allowed||c.day>=14?'disabled':''}>${c.day>=14?tr('Day 14 reached','已到第十四天'):tr('Advance to next checkpoint','推进到下一个检查日')} →</button></div></div>
      <div class="card"><div class="card-body"><h2>${tr('Customer update composer','客户更新练习')}</h2>${field(tr('Your practice update — English or Chinese','你的练习更新（中英皆可）'),area('updateDraft',c.updateDraft,'Known issue and impact → action / containment → next checkpoint. Do not invent a fix ETA.'))}<div class="step-footer"><button class="btn btn-secondary" data-action="check-update">${tr('Check update structure','检查更新结构')}</button><button class="btn btn-primary" data-action="log-update">${tr('Log practice update','记录练习更新')}</button></div>${c.updateFeedback?`<div class="feedback-list">${updateFeedback(c.updateDraft).map(r=>`<div class="feedback-item ${r.pass?'test-pass':'test-fail'}">${r.pass?'✓':'!'} ${tr(r.label,r.zh)}</div>`).join('')}<p class="small muted">${tr('This checks structure only. It cannot verify tone, accuracy, security or whether your promise is realistic.','仅检查结构，不能核实语气、事实、安全性或承诺是否可实现。')}</p>`:''}<details><summary>${tr('See a sample update','查看更新范例')}</summary><blockquote>${esc(s.suggestedUpdate)}</blockquote></details>${c.updates.map(u=>`<div class="log-entry"><span class="small muted">Day ${u.day} · ${shortTime(u.at)} · ${tr('Practice only','仅为练习')}</span><p>${esc(u.text)}</p></div>`).join('')}</div></div><div class="card"><div class="card-body">${field(tr('Day-14 handover / recovery summary','第十四天交接／恢复总结'),area('followup',c.followup,'What was verified? Which issues remain open? Who owns them? What did the customer confirm?'))}${coach('followup')}<button class="btn btn-secondary" data-action="save-followup">${tr('Log handover summary','记录交接总结')}</button></div></div>${nextButton('Review my work')}`;

 the only valid operational answer.','建议完成后再查看。实际工作中可能有其他合理方案。')}</p>${['discovery','configuration','ticket','launch','followup'].map(k=>coach(k,k[0].toUpperCase()+k.slice(1))).join('')}</div></div>`;

  function invalidate(c) { c.ruleRevision++;c.qaResults={};c.launchStatus='';c.approved=false;c.customerApproval=false;for(const name of ['approved','customerApproval']){const box=document.querySelector(`[data-field="${name}"]`);if(box)box.checked=false;} }
  function saveInput(el) {
    const c=work();
    if(el.dataset.rule) { if(c.rules[el.dataset.rule]!==el.value){c.rules[el.dataset.rule]=el.value;invalidate(c);} }
    else if(el.dataset.ticket) c.ticketDraft[el.dataset.ticket]=el.value;
    else if(el.dataset.agent) { c.agentAnswers[el.dataset.agent]=el.value;delete c.qaResults[el.dataset.agent];c.launchStatus='';const row=el.closest('.test-row');if(row){row.classList.remove('test-pass','test-fail');const badge=row.querySelector('.issue-meta .tag:nth-child(2)');if(badge){badge.className='tag tag-neutral';badge.textContent=tr('Not run','未测试');}} }
    else if(el.dataset.triage) { const id=el.dataset.triage;c.classifications[id]||={};c.classifications[id][el.dataset.key]=el.value;c.triageGraded=false;c.launchStatus='';el.closest('.issue-card')?.querySelector('.banner')?.remove(); }
    else if(el.dataset.field) { const k=el.dataset.field;c[k]=el.type==='checkbox'?el.checked:el.value;if(['approved','customerApproval','coverage'].includes(k)&&!c[k])c.launchStatus=''; }
    clearTimeout(savingTimer);savingTimer=setTimeout(persist,150);
  }
  document.addEventListener('input',e=>saveInput(e.target));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.sidebar')?.classList.remove('is-open');});

    if(e.target.dataset.rule) log('Configuration edited',`${e.target.dataset.rule}: ${e.target.value}. Earlier QA invalidated.`);
    if(e.target.dataset.field&&e.target.type==='checkbox') {persist();if(['customerApproval','coverage'].includes(e.target.dataset.field)) render();}

  document.addEventListener('click',e=>{
    const button=e.target.closest('[data-action],[data-stage],[data-route]');if(!button)return;
    if(button.disabled)return;e.preventDefault();
    const c=work(),s=scenario();notice=null;
    if(button.dataset.stage!==undefined){c.stage=Number(button.dataset.stage);route='workspace';persist();render();window.scrollTo(0,0);return;}

      case 'mobile-nav':document.querySelector('.sidebar')?.classList.toggle('is-open');break;

      case 'dismiss':render();break;
      case 'language':state.language=state.language==='en'?'zh':'en';persist();render();break;
      case 'open-case':switchCase(id);break;

      case 'check-config':c.configFeedback=true;log('Worksheet checked',`${s.rules.filter(r=>rulePass(s,c,r)).length}/${s.rules.length} rules match.`);render();break;
      case 'grade-triage':c.triageGraded=true;log('Issue classification reviewed',`${s.issues.filter(i=>classificationCorrect(i,c.classifications[i.id])).length}/${s.issues.length} issues correctly classified.`);render();break;
      case 'save-draft':log('Ticket draft saved',c.ticketDraft.title||'Untitled draft');toast(tr('Draft saved. No ticket created yet.','已保存草稿，尚未创建工单。'));break;
      case 'from-triage':{const x=c.classifications[c.ticketDraft.issueId]||{};for(const k of ['type','severity','priority','owner'])c.ticketDraft[k]=x[k]||'';persist();render();break;}
      case 'open-ticket':currentTicket=id;render();document.querySelector('.ticket-details')?.scrollIntoView({block:'center'});break;
      case 'close-ticket-detail':currentTicket=null;render();break;
      case 'edit-ticket':{const t=c.tickets.find(t=>t.id===id);if(t){c.ticketDraft=Object.fromEntries(TICKET_FIELDS.map(k=>[k,t[k]||'']));c.ticketDraft.editingId=id;persist();currentTicket=null;render();toast(tr('Copied to draft. Submit to update this ticket.','已复制到草稿，提交后更新此工单。'));}break;}
      case 'ack-ticket':{const t=c.tickets.find(t=>t.id===id);if(t&&!t.acknowledgedAt){t.acknowledgedAt=now();t.status='In progress';log('Simulated owner acknowledgement',`${t.id}: ${t.owner} accepted the practice handoff. Next action: ${t.nextAction}`);render();toast(tr('Simulated owner accepted the handoff. Verify the result before resolution.','模拟负责人已接收交接，关闭前仍需验证结果。'));}break;}
      case 'update-ticket':updateTicket(id);break;

      case 'record-launch':recordLaunch();break;

      case 'review-event':{const index=Number(button.dataset.index),ev=s.monitoring[index];if(!ev||ev.day>c.day)return;if(ev.issueId&&!c.tickets.some(t=>t.issueId===ev.issueId)){flash(tr('Create or link a ticket for this distinct issue before logging it as reviewed.','此问题尚无关联工单，请先建立或关联工单。'),'warning');return;}if(!c.reviewedEvents.includes(index)){c.reviewedEvents.push(index);log('Monitoring event reviewed',`Day ${ev.day}: ${ev.title}${ev.issueId?' · linked to '+c.tickets.filter(t=>t.issueId===ev.issueId).map(t=>t.id).join(', '):''}`);}render();break;}
      case 'check-update':c.updateFeedback=true;persist();render();break;
      case 'log-update':if(wordish(c.updateDraft)<80){c.updateFeedback=true;flash(tr('Write a specific update of at least 80 characters. Include impact, action and the next checkpoint.','请填写至少 80 字符的具体更新，包含影响、动作及下次检查时间。'),'warning');}else{c.updates.push({text:c.updateDraft,at:now(),day:c.day});log('Practice customer update logged',c.updateDraft);c.updateDraft='';c.updateFeedback=false;render();toast(tr('Logged locally. Nothing was sent.','已在本地记录，没有发送消息。'));}break;
      case 'save-followup':if(wordish(c.followup)<40){flash(tr('Describe verified outcomes, remaining issues and the receiving owner (40+ characters).','请描述验证结果、未解决问题和承接负责人（至少 40 字符）。'),'warning');}else{log('Handover summary recorded',c.followup);toast(tr('Handover logged. Open incidents still need named ownership.','已记录交接，未解决事件仍需明确负责人。'));}break;
      case 'coach':{const k=button.dataset.key;c.coachOpen||=[];if(c.coachOpen.includes(k)){c.coachOpen=c.coachOpen.filter(x=>x!==k);}else{c.coachOpen.push(k);if(!c.coachViewed.includes(k)){c.coachViewed.push(k);log('Coach reference opened',k);}}persist();render();break;}
      case 'export':download(`OSM-progress-${dateSlug()}.json`,JSON.stringify(state,null,2),'application/json');toast(tr('Progress exported. Keep this file to restore your work.','已导出进度，可用此文件恢复练习。'));break;
      case 'import':document.getElementById('import-file').click();break;
      case 'export-tickets':exportTickets();break;
      case 'export-rules':downloadCSV(`${s.id}-configuration.csv`,['Rule ID','Operational rule','Your value','Revision','Customer approval'],s.rules.map(r=>[r.id,r.label,c.rules[r.id],c.ruleRevision+1,c.approved?'Yes':'No']));break;
      case 'export-log':downloadCSV(`${s.id}-activity.csv`,['Timestamp UTC','Action','Detail'],c.log.map(l=>[l.at,l.action,l.detail]));break;
      case 'reset-case':if(confirm(tr('Reset this case only? Export your progress first if you want to keep it.','仅重置当前案例？如需保留，请先导出进度。'))){state.cases[s.id]=freshCase(s);currentTicket=null;log('Case restarted',s.title);render();}break;
    }
  });
  function switchCase(id) {if(!SCENARIOS.some(s=>s.id===id))return;persist();state.selectedCase=id;route='workspace';currentTicket=null;notice=null;persist();render();window.scrollTo(0,0);}
  function createTicket() {
    const c=work(),d=c.ticketDraft;
    const required=['issueId','title','type','severity','priority','owner','environment','expected','actual','nextAction','updateTime','acceptance'];
    const missing=required.filter(k=>!String(d[k]||'').trim());
    if(missing.length){flash(tr('Ticket not created. Complete these fields: ','尚未创建工单，请完成：')+missing.join(', '),'warning');return;}
    const existing=d.editingId?c.tickets.find(t=>t.id===d.editingId):null;
    const t=Object.fromEntries(TICKET_FIELDS.map(k=>[k,String(d[k]||'')]));
    if(existing){t.id=existing.id;t.createdAt=existing.createdAt;t.status=existing.status==='Closed'?'Awaiting validation':existing.status;t.acknowledgedAt=existing.owner===t.owner?(existing.acknowledgedAt||''):'';c.tickets[c.tickets.findIndex(x=>x.id===t.id)]=t;}
    else {t.id=`SIM-${scenario().id.toUpperCase().slice(0,10)}-${String(c.tickets.length+1).padStart(3,'0')}`;t.createdAt=now();t.status='New';t.acknowledgedAt='';c.tickets.push(t);}
    currentTicket=t.id;c.ticketDraft=freshDraft(scenario());log(existing?'Ticket updated':'Practice ticket created',`${t.id}: ${t.title} · checklist ${ticketScore(t).total}/100`);render();document.querySelector('.ticket-details')?.scrollIntoView({block:'center'});
  }
  function updateTicket(id) {
    const c=work(),t=c.tickets.find(t=>t.id===id);if(!t)return;
    const status=document.getElementById('ticket-status')?.value,note=document.getElementById('ticket-closure')?.value||'';
    if(['Resolved','Closed'].includes(status)){
      const passed=scenario().qa.every(q=>c.qaResults[q.id]?.pass&&c.qaResults[q.id].revision===c.ruleRevision);
      if(!passed||wordish(note)<40||!t.acknowledgedAt){flash(tr('Keep this ticket open: the owner must acknowledge it, current QA must pass and the resolution note must cite the change, retest and remaining impact (40+ characters).','请保持工单开放：负责人需确认接收，当前 QA 必须通过，且关闭记录需说明变更、复测和剩余影响（至少 40 字符）。'),'warning');return;}
      if(status==='Closed'&&!c.updates.length){flash(tr('Log a practice customer update before closing the ticket; a deployed fix alone is not customer closure.','关闭前请记录客户更新。发布修复不等于客户问题已关闭。'),'warning');return;}
    }
    if(!STATUSES.includes(status))return;t.status=status;t.closure=note;log('Ticket status updated',`${id} → ${status}. ${note}`);render();
  }
  function runTests(tests) {
    const s=scenario(),c=work();let passed=0;
    for(const q of tests){const pass=qaPass(s,c,q);if(pass)passed++;c.qaResults[q.id]={pass,at:now(),revision:c.ruleRevision};}
    c.launchStatus='';log('QA tests executed',`${passed}/${tests.length} passed on configuration revision ${c.ruleRevision+1}.`);render();toast(`${passed}/${tests.length} ${tr('tests passed','测试通过')}`);
  }
  function recordLaunch() {
    const c=work(),s=scenario();if(!c.launchDecision||wordish(c.launchReason)<40){flash(tr('Choose a decision and explain the evidence, scope and next step (40+ characters).','请选择决定，并解释证据、范围和下一步（至少 40 字符）。'),'warning');return;}
    if(c.launchDecision!=='hold'){
      if((s.phase==='live'&&c.launchDecision!=='recover')||(s.phase!=='live'&&c.launchDecision!=='launch')){flash('Choose a decision appropriate to this case.','warning');return;}
      const r=readiness();if(!r.ready){flash(tr('Release blocked: complete the readiness evidence first. A written rationale cannot override failed checks.','发布被阻止：请先完成准备证据。书面理由不能覆盖失败检查。'),'error');return;}
    }
    c.launchStatus=c.launchDecision==='hold'?'held':c.launchDecision==='recover'?'recovered':'launched';
    log('Launch / recovery decision recorded',`${c.launchStatus}: ${c.launchReason}`);render();
  }
  function advanceDay() {
    const c=work(),s=scenario();if(!['launched','recovered'].includes(c.launchStatus)&&s.phase!=='live'&&!(s.targetLaunchDecision==='hold'&&c.launchStatus==='held')){flash('Complete a verified launch/recovery decision before advancing.','warning');return;}
    const days=[...new Set([1,3,7,10,14,...s.monitoring.map(e=>e.day)])].sort((a,b)=>a-b);const next=days.find(d=>d>c.day);
    if(next===undefined)return;c.day=next;log('Simulation advanced',`Customer day ${next}; ${s.monitoring.filter(e=>e.day===next).length} incoming event(s).`);render();
  }
  function dateSlug(){return new Date().toISOString().slice(0,10);}
  function download(name,content,type) {const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  function csvCell(v) {let text=String(v??'');if(/^\s*[=+\-@]|^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}
  function downloadCSV(name,headers,rows){download(name,'\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
  function exportTickets(){const c=work();downloadCSV(`${scenario().id}-tickets.csv`,['Ticket ID','Related issue','Title','Type','Severity','Priority','Owner','Environment','Status','Expected','Actual','Reproduction','Evidence','Containment','Next action','Next update America/New_York local','Acceptance','Resolution note','Created UTC','Checklist score'],c.tickets.map(t=>[t.id,t.issueId,t.title,t.type,t.severity,t.priority,t.owner,t.environment,t.status,t.expected,t.actual,t.repro,t.evidence,t.workaround,t.nextAction,t.updateTime,t.acceptance,t.closure,t.createdAt,ticketScore(t).total]));}
  async function importProgress(file) {
    if(!file)return;
    if(file.size>2*1024*1024){flash('Import rejected: choose a progress JSON file smaller than 2 MB.','error');return;}
    try {
      const incoming=sanitise(JSON.parse(await file.text()));
      if(!confirm(tr('Import replaces saved attempts in this browser. Export your current work first if needed. Continue?','导入会替换此浏览器的现有进度。如需保留，请先导出。继续吗？')))return;
      state=incoming;currentTicket=null;route='workspace';persist();render();toast(tr('Progress restored. Imported QA was checked against your worksheet.','进度已恢复，导入 QA 已与工作表重新核对。'));
    } catch(e) {flash('Import rejected: '+e.message,'error');}
  }
  window.addEventListener('beforeunload',persist);
  // Read-only hooks support repeatable browser tests without bypassing the UI.
  window.OSM_LAB = {getState:()=>JSON.parse(JSON.stringify(state)),getScenarios:()=>JSON.parse(JSON.stringify(SCENARIOS)),getReadiness:()=>readiness(),getScore:()=>score(),storageKey:STORAGE_KEY};
  render();
})();
</script></body></html>
